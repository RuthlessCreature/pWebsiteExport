name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare licensed local photography
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets/photos
          curl -fL --retry 3 'https://images.pexels.com/photos/9800000/pexels-photo-9800000.jpeg?auto=compress&dpr=1&h=900&w=1600' -o public/assets/photos/ev-charging.jpg
          curl -fL --retry 3 'https://images.pexels.com/photos/28752153/pexels-photo-28752153/free-photo-of-close-up-of-precision-machined-metal-parts.jpeg?auto=compress&dpr=1&h=900&w=1600' -o public/assets/photos/precision-machining.jpg
          curl -fL --retry 3 'https://images.pexels.com/photos/36423822/pexels-photo-36423822/free-photo-of-glass-bottles-on-a-production-line-in-factory.jpeg?auto=compress&dpr=1&h=900&w=1600' -o public/assets/photos/glass-packaging.jpg
          curl -fL --retry 3 'https://images.pexels.com/photos/4481326/pexels-photo-4481326.jpeg?auto=compress&dpr=1&h=900&w=1600' -o public/assets/photos/mixed-sku-warehouse.jpg
          curl -fL --retry 3 'https://images.pexels.com/photos/15195270/pexels-photo-15195270/free-photo-of-hotel-room-welcome-amenities-photo.jpeg?auto=compress&dpr=1&h=900&w=1600' -o public/assets/photos/hospitality-supplies.jpg
          curl -fL --retry 3 'https://images.pexels.com/photos/3912477/pexels-photo-3912477.jpeg?auto=compress&dpr=1&h=900&w=1600' -o public/assets/photos/product-development.jpg
          curl -fL --retry 3 'https://images.pexels.com/photos/19841116/pexels-photo-19841116.jpeg?auto=compress&dpr=1&h=900&w=1600' -o public/assets/photos/industrial-vision.jpg
          curl -fL --retry 3 'https://images.pexels.com/photos/36594160/pexels-photo-36594160/free-photo-of-industrial-worker-inspecting-batteries-in-warehouse.jpeg?auto=compress&dpr=1&h=900&w=1600' -o public/assets/photos/energy-storage.jpg
          curl -fL --retry 3 'https://images.pexels.com/photos/4487363/pexels-photo-4487363.jpeg?auto=compress&dpr=1&h=900&w=1600' -o public/assets/photos/warehouse-racking.jpg
          curl -fL --retry 3 'https://images.pexels.com/photos/8089156/pexels-photo-8089156.jpeg?auto=compress&dpr=1&h=900&w=1600' -o public/assets/photos/kitchen-cabinets.jpg
          curl -fL --retry 3 'https://images.pexels.com/photos/18915643/pexels-photo-18915643.jpeg?auto=compress&dpr=1&h=900&w=1600' -o public/assets/photos/process-tanks.jpg
          curl -fL --retry 3 'https://images.pexels.com/photos/17641123/pexels-photo-17641123.jpeg?auto=compress&dpr=1&h=900&w=1600' -o public/assets/photos/solar-rooftop.jpg
          curl -fL --retry 3 'https://images.pexels.com/photos/10117742/pexels-photo-10117742.jpeg?auto=compress&dpr=1&h=900&w=1600' -o public/assets/photos/pendant-lighting.jpg
          curl -fL --retry 3 'https://images.pexels.com/photos/35645884/pexels-photo-35645884.jpeg?auto=compress&dpr=1&h=900&w=1600' -o public/assets/photos/industrial-pumps.jpg
          curl -fL --retry 3 'https://images.pexels.com/photos/14805031/pexels-photo-14805031.jpeg?auto=compress&dpr=1&h=900&w=1600' -o public/assets/photos/woodworking.jpg
          test "$(find public/assets/photos -type f -name '*.jpg' | wc -l)" -ge 15

      - name: Normalize public contact identity
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            sed -i \
              -e 's/Nicole/Yusuf/g' \
              -e 's/13923387986@163.com/abd.yusuf.ibrahim.mustafa@gmail.com/g' \
              -e 's/+86 139 2338 7986/+86 132 4269 4270/g' \
              -e 's/+8613923387986/+8613242694270/g' \
              -e 's/8613923387986/8613242694270/g' "$f"
          done < <(find public -type f \( -name '*.html' -o -name '*.js' -o -name '*.xml' -o -name '*.txt' \) -print0)

      - name: Build SEO pages, multilingual knowledge center and metadata
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_seo.py scripts/seo_enhance.py scripts/build_guides.py scripts/build_guides_i18n.py scripts/build_guides_i18n_full.py scripts/notify_indexnow.py
          python scripts/build_seo.py
          python scripts/seo_enhance.py
          python scripts/build_guides.py
          python scripts/build_guides_i18n_full.py

      - name: Validate static site, case library and SEO gates
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RniE 'images\.pexels\.com|pexels\.com|openai|chatgpt|api\.openai\.com|fonts\.googleapis\.com|cdnjs|jsdelivr|unpkg' public --include='*.html' --include='*.css' --include='*.js'
          ! grep -RniE 'Nicole|13923387986@163\.com|139 2338 7986|8613923387986' public --include='*.html' --include='*.js'
          ! grep -Rni 'pwebsite-export\.nostalgia-ho\.workers\.dev' public --include='*.html' --include='*.xml' --include='*.txt'
          for f in public/en/index.html public/zh/index.html public/ja/index.html public/ru/index.html public/es/index.html public/pt/index.html public/ja/cases/index.html public/ru/cases/index.html public/es/cases/index.html public/pt/cases/index.html; do test -s "$f"; done
          node --check public/assets/site.js
          node --check public/assets/cases-part-1.js
          node --check public/assets/cases-part-2.js
          node --check public/assets/cases-part-3.js
          node --check public/assets/cases-part-4.js
          node --check public/assets/cases-render.js
          node -e "global.window={}; require('./public/assets/cases-part-1.js'); require('./public/assets/cases-part-2.js'); require('./public/assets/cases-part-3.js'); require('./public/assets/cases-part-4.js'); if (!window.CASE_LIBRARY || window.CASE_LIBRARY.length !== 36) throw new Error('Expected 36 cases, got '+(window.CASE_LIBRARY&&window.CASE_LIBRARY.length)); console.log('Case library OK: '+window.CASE_LIBRARY.length);"
          test "$(find public/case-studies -mindepth 2 -maxdepth 2 -name index.html | wc -l)" -eq 36
          python -c "import json,pathlib; a=json.load(open('scripts/seo_pages_core.json')); b=json.load(open('scripts/seo_pages_industries.json')); assert len(a)+len(b)==14; assert all((pathlib.Path('public')/x['slug']/'index.html').is_file() for x in a+b); print('SEO landing pages OK: 14')"
          python -c "import json,pathlib; g=json.load(open('scripts/seo_guides.json')); assert len(g)==8; assert pathlib.Path('public/resources/guides/index.html').is_file(); assert all((pathlib.Path('public/resources/guides')/x['slug']/'index.html').is_file() for x in g); print('English buyer guides OK: 8 + hub')"
          python -c "import json; from pathlib import Path; codes=['zh','ja','ru','es','pt']; slugs=[x['slug'] for x in json.load(open('scripts/seo_guides.json'))]; assert all((Path('public')/c/'resources/guides/index.html').is_file() for c in codes); assert sum(1 for c in codes for s in slugs if (Path('public')/c/'resources/guides'/s/'index.html').is_file())==40; print('Localized buyer guides OK: 40 + 5 hubs')"
          grep -q 'rel="canonical" href="https://pomerol.in/en/"' public/en/index.html
          grep -q 'hreflang="ja"' public/en/index.html
          grep -q 'hreflang="x-default"' public/en/index.html
          grep -q 'application/ld+json' public/en/index.html
          grep -q '"@type":"Service"' public/china-sourcing-agent/index.html
          grep -Rql '"@type":"Article"' public/case-studies
          grep -q '"@type":"Article"' public/resources/guides/how-to-source-products-from-china/index.html
          for code in zh ja ru es pt; do
            grep -q '"@type":"Article"' "public/$code/resources/guides/china-sourcing-cost-breakdown/index.html"
            grep -q 'hreflang="en"' "public/$code/resources/guides/oem-vs-odm-china-guide/index.html"
            grep -q 'hreflang="x-default"' "public/$code/resources/guides/china-sample-approval-process/index.html"
            grep -q "/$code/resources/guides/" "public/$code/index.html"
          done
          for lang in zh-CN ja ru es pt x-default; do grep -q "hreflang=\"$lang\"" public/resources/guides/china-sourcing-cost-breakdown/index.html; done
          grep -q 'data-seo-service-directory' public/services/index.html
          grep -q 'data-buyer-guides' public/resources/index.html
          grep -q '/resources/guides/' public/en/index.html
          grep -q '/china-sourcing-agent/' public/en/index.html
          grep -q 'https://pomerol.in/zh/resources/guides/china-sourcing-cost-breakdown/' public/sitemap.xml
          grep -q 'https://pomerol.in/pt/resources/guides/oem-vs-odm-china-guide/' public/sitemap.xml
          grep -q 'xmlns:image=' public/sitemap.xml
          ! grep -q '<lastmod>' public/sitemap.xml
          ! grep -RniE 'datePublished|dateModified' public --include='*.html'
          test -s public/llms.txt
          grep -q 'https://pomerol.in/resources/guides/' public/llms.txt
          test "$(cat public/02289c9f560410ae6b1db5dab06ccccc.txt)" = '02289c9f560410ae6b1db5dab06ccccc'
          python -c "from pathlib import Path; import re; root=Path('public'); m=[(str(h),r) for h in root.rglob('*.html') for r in re.findall(r'(?:src|href)=\"(/[^\"]+)\"',h.read_text(encoding='utf-8')) if (r.startswith('/assets/') or r.startswith('/resources/')) and not (root/r.lstrip('/')).exists()]; print('Local asset references OK' if not m else m[:20]); raise SystemExit(1 if m else 0)"

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.102.0"
          command: deploy

      - name: Verify and notify IndexNow
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: python scripts/notify_indexnow.py

      - name: Report deployment status
        if: always()
        uses: actions/github-script@v8
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const success = process.env.DEPLOY_OUTCOME === 'success';
            const rawUrl = (process.env.DEPLOYMENT_URL || '').trim();
            const deploymentHost = rawUrl ? rawUrl.split(/\s+/)[0] : '';
            const deploymentUrl = deploymentHost && !/^https?:\/\//i.test(deploymentHost)
              ? `https://${deploymentHost}`
              : deploymentHost;
            const actionsUrl = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              target_url: success && deploymentUrl ? deploymentUrl : actionsUrl,
              description: success ? 'Cloudflare Worker deployed' : 'Cloudflare Worker deployment failed',
              context: 'cloudflare-worker'
            });
