name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.102.0"
          command: deploy

      - name: Report deployment status
        if: always()
        uses: actions/github-script@v8
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const success = process.env.DEPLOY_OUTCOME === 'success';
            const rawUrl = (process.env.DEPLOYMENT_URL || '').trim();
            const deploymentUrl = rawUrl ? rawUrl.split(/\s+/)[0] : '';
            const actionsUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              target_url: success && deploymentUrl ? deploymentUrl : actionsUrl,
              description: success ? 'Cloudflare Worker deployed' : 'Cloudflare Worker deployment failed',
              context: 'cloudflare-worker'
            });
