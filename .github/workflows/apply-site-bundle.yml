name: Apply rebuilt site bundle

on:
  push:
    branches:
      - revamp/multilingual-visual-worker-only
    paths:
      - '.site-bundle.part*'
      - '.github/workflows/apply-site-bundle.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Rebuild site source from bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .site-bundle.part00 .site-bundle.part01 .site-bundle.part02 > /tmp/site.b64
          base64 -d /tmp/site.b64 > /tmp/site.tar.gz
          mkdir -p /tmp/site
          tar -xzf /tmp/site.tar.gz -C /tmp/site
          cp -a /tmp/site/pWebsiteExport/. .

      - name: Enforce Worker-only runtime gate
        shell: bash
        run: |
          set -euo pipefail
          forbidden='api\.openai\.com|chatgpt\.com|openai\.com|fonts\.googleapis\.com|fonts\.gstatic\.com|cdn\.jsdelivr\.net|unpkg\.com|cdnjs\.cloudflare\.com'
          if grep -RniE "$forbidden" public; then
            echo 'Forbidden external runtime dependency detected.' >&2
            exit 1
          fi

      - name: Commit rebuilt source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .site-bundle.part00 .site-bundle.part01 .site-bundle.part02
          rm -f .github/workflows/apply-site-bundle.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- ARCHITECTURE.md README.md CHANGELOG.md package.json wrangler.jsonc .gitignore public
          git rm --ignore-unmatch .site-bundle.part00 .site-bundle.part01 .site-bundle.part02 .github/workflows/apply-site-bundle.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Revamp multilingual visual Worker-only website'
            git push origin HEAD:revamp/multilingual-visual-worker-only
          fi
